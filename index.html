`<div class="grid g2" style="margin-top:18px"><div class="card"><div class="mut sm">Tu foco actual</div><h2 style="margin:4px 0">${E(fo?.area||'–')}</h2><p style="margin:0">${E(fo?.next_action||'Define un objetivo en Evolución.')}</p></div>

${d.fmt=='3x3'?'<label>Evento</label><input id="n_e" placeholder="Nombre del evento">':''}<label>Local</label><input id="n_h" value="${E(a.home||'')}"><label>Visitante</label><input id="n_a" value="${E(a.away||'')}"><label>Resultado</label><input id="n_r">

${d.learn?`<select id="n_la">${AR.map(x=>`<option>${x}</option>`).join('')}</select><input id="n_lt" placeholder="Situación"><textarea id="n_lw" placeholder="Qué ocurrió"></textarea><textarea id="n_ls" placeholder="Qué debería haber hecho"></textarea>`:''}
<button class="btn" style="width:100%;padding:14px" onclick="saveG('${id}')">Guardar partido</button>`},

return`<h1>Evolución</h1><div class="tabs">${[['res','Resumen'],['apr','Aprendizajes'],['obj','Objetivos']].map(x=>`<button class="${t==x[0]?'on':''}" onclick="st.evo='${x[0]}';render()">${x[1]}</button>`).join('')}</div>${b}`},
more(){return`<h1>Más</h1>${[['venues','Instalaciones'],['seasons','Temporadas'],['ledger','Contabilidad'],['out','Cerrar sesión']].map(x=>`<div class="row" onclick="${x[0]=='out'?'sb.auth.signOut().then(()=>location.reload())':`go('#/${x[0]}')`}"><b>${x[1]}</b><span>›</span></div>`).join('')}`},
venues(){return`<a class="back" onclick="go('#/more')">‹ Más</a><h1 style="margin:8px 0">Instalaciones</h1>${D.venues.map(v=>{const n=D.games.filter(g=>g.venue_id==v.id).length,t=D.rates.find(x=>x.id==v.locality_id);return`<div class="card" style="margin:10px 0"><b>${E(v.name)}</b> <span class="mut">${E(v.municipality||'')}</span><div class="sm mut">${[v.court&&'Pista: '+v.court,v.locker_room&&'Vestuario: '+v.locker_room,v.table_info&&'Mesa: '+v.table_info,v.access&&'Aparcamiento: '+v.access,v.lighting&&'Luz: '+v.lighting,v.notes].filter(Boolean).map(E).join(' · ')}</div><span class="chip">${n} partidos</span>${t?`<span class="chip o">Transporte ${eur(t.amount)}</span>`:'<span class="chip w">Sin tarifa de transporte</span>'}</div>`}).join('')}`},
seasons(){return`<a class="back" onclick="go('#/more')">‹ Más</a><h1 style="margin:8px 0">Temporadas</h1>${D.seasons.map(s=>{const g=D.games.filter(x=>x.season_id==s.id);return`<div class="card" style="margin:10px 0"><h3>${E(s.name)}</h3><p class="mut sm" style="margin:2px 0">${g.length} partidos registrados · evaluación ${nf(av(g.filter(x=>x.overall).map(x=>+x.overall)))}</p><p class="sm">${E(s.summary||'')}</p><p class="sm"><b>Objetivo:</b> ${E(s.goal||'')}</p></div>`}).join('')}`},
ledger(){const g=D.games.filter(x=>x.fee_referee!=null),tot=g.reduce((a,x)=>a+ +x.total_fee,0),cob=g.filter(x=>x.payment_status=='cobrado').reduce((a,x)=>a+ +x.total_fee,0);return`<a class="back" onclick="go('#/more')">‹ Más</a><h1 style="margin:8px 0">Contabilidad</h1><div class="grid g3"><div><div class="num">${eur(tot)}</div><div class="mut sm">generado</div></div><div><div class="num">${eur(cob)}</div><div class="mut sm">cobrado</div></div><div><div class="num">${eur(tot-cob)}</div><div class="mut sm">pendiente</div></div></div><h2>Partidos con honorario</h2>${g.map(x=>`<div class="row" onclick="go('#/game/${x.id}')"><div><b>${E(gname(x))}</b><div class="mut sm">${fd(x.played_on)}</div></div><div style="text-align:right"><b>${eur(x.total_fee)}</b><div class="sm mut">${x.payment_status}</div></div></div>`).join('')}<p class="sm mut">Los partidos sin honorario registrado no aparecen aquí.</p>`}};
async function saveA(){const v=i=>$('#'+i).value||null;if(!v('a_d'))return toast('Pon fecha y hora');const{error}=await sb.from('assignments').insert({starts_at:new Date(v('a_d')).toISOString(),home:v('a_h'),away:v('a_a'),category_id:v('a_c'),role:v('a_r'),venue_id:v('a_v'),partner:v('a_p'),source:'manual'});if(error)return toast('Error: '+error.message);await load();toast('Designación guardada');go('#/agenda')}
async function saveG(id){const d=st.draft,v=i=>$('#'+i)?.value||null;if(!d.ev)return toast('Elige una evaluación');const a=D.assign.find(x=>x.id==id),date=v('n_d'),c=v('n_c'),ro=v('n_ro'),vn=v('n_v'),p=calc(c,ro,date,vn);
const row={played_on:date,season_id:cur()?.id,home:v('n_h'),away:v('n_a'),result:v('n_r'),category_id:c,role:ro,venue_id:vn,partner:v('n_p'),overall:d.ev,did_well:v('n_g'),to_improve:v('n_i'),format:d.fmt,event_name:v('n_e'),assignment_id:a?.id||null,fee_referee:p.fee,transport_fee:p.tr,fee_source:p.fee!=null?'calculada':null,source:a?'designación':'manual',match_type:d.fmt=='3x3'?'torneo':'liga',gender:c?cat(c).gender:null};
const{data,error}=await sb.from('games').insert(row).select().single();if(error)return toast('Error: '+error.message);
if(a)await sb.from('assignments').update({status:'Arbitrado'}).eq('id',a.id);
if(d.learn&&v('n_lt')){const l=await sb.from('learnings').insert({area:v('n_la'),title:v('n_lt'),what_happened:v('n_lw'),should_have:v('n_ls')}).select().single();if(l.data)await sb.from('game_learnings').insert({game_id:data.id,learning_id:l.data.id})}
st.draft=null;await load();toast('Partido guardado');go('#/game/'+data.id)}
async function pay(id){await sb.from('games').update({payment_status:'cobrado',paid_on:new Date().toISOString().slice(0,10)}).eq('id',id);await load();render();toast('Marcado como cobrado')}
async function lst(id,s){await sb.from('learnings').update({status:s}).eq('id',id);await load();render()}
async function focus(id){await sb.from('goals').update({is_focus:false}).neq('id',id);await sb.from('goals').update({is_focus:true}).eq('id',id);await load();render()}
function render(){const h=(location.hash||'#/').slice(2).split('/'),k=h[0]||'home',m={agenda:'agenda',newa:'agenda',new:'home',games:'games',game:'games',evo:'evo'}[k]||(k=='home'?'home':'more');
$('#nav').innerHTML=[['','Inicio','home'],['agenda','Agenda','agenda']].map(x=>`<a class="${m==x[2]?'on':''}" onclick="go('#/${x[0]}')">${x[1]}</a>`).join('')+`<button class="plus" onclick="go('#/new/x')" aria-label="Registrar partido">＋</button>`+[['games','Partidos'],['evo','Evolución'],['more','Más']].map(x=>`<a class="${m==x[0]?'on':''}" onclick="go('#/${x[0]}')">${x[1]}</a>`).join('');
$('#app').innerHTML=(V[k]||V.home)(h[1]);window.scrollTo(0,0)}
function loginView(msg){$('#nav').hidden=true;$('#app').innerHTML=`<div class="login"><h1>ARBITRA</h1><p class="mut">Acceso privado</p><label>Email</label><input id="l_e" type="email" autocomplete="username"><label>Contraseña</label><input id="l_p" type="password" autocomplete="current-password"><button class="btn" style="width:100%" onclick="login()">Entrar</button><p class="sm" style="color:var(--wn)">${msg||''}</p></div>`}
async function login(){const{error}=await sb.auth.signInWithPassword({email:$('#l_e').value,password:$('#l_p').value});error?loginView('Email o contraseña incorrectos'):start()}
async function start(){const{data}=await sb.auth.getSession();if(!data.session)return loginView();$('#nav').hidden=false;$('#app').innerHTML='<p class="mut">Cargando…</p>';await load();render()}
addEventListener('hashchange',()=>D.games&&render());start();
</script></body></html>
