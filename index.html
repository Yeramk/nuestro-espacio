const DRE=/(\d{1,2})[\/.\-](\d{1,2})(?:[\/.\-](\d{2,4}))?/,TRE=/\b([01]?\d|2[0-3])(?::|h)([0-5]\d)\b/;

function guessCat(ln){const n=norm(ln),lv=[['benjamin','Benjam'],['minibasket','Minibasket'],['infantil','Infantil'],['cadete','Cadete'],['junior','Junior'],['senior','Senior']].find(x=>n.includes(x[0]));if(!lv)return'';const comp=n.includes('liic')?'LIIC':'Autonómico',g=/femen|\bfem\b|\(f\)/.test(n)?'F':/mascul|\bmasc\b|\(m\)/.test(n)?'M':null,c=D.cats.filter(x=>norm(x.level).includes(lv[0].slice(0,6))&&x.competition==comp&&(!g||x.gender==g));return c.length==1?c[0].id:''}

for(const ln of lines){const d=pd(ln);if(d){dates.push(d);cur=d}const t=ln.match(TRE),n=norm(ln);if(!(toks.length&&toks.every(k=>n.includes(k)))||!(d||cur))continue;

rows.push({date:d||cur,time:t?`${t[1].padStart(2,'0')}:${t[2]}`:'',home:(tm[0]||'').trim(),away:(tm[1]||'').trim(),category_id:guessCat(ln),role:'Principal',locality_id:D.rates.find(v=>n.includes(norm(v.locality)))?.id||'',partner:'',officials:'',raw:ln,sel:1})}

function classify(r){const ex=D.assign.find(a=>dOf(a.starts_at)==r.date&&norm(a.home)==norm(r.home)&&norm(a.away)==norm(r.away));if(!ex)return{k:'new'};const df=[];if(r.time&&tOf(ex.starts_at)!=r.time)df.push(`hora ${tOf(ex.starts_at)} → ${r.time}`);if(r.locality_id&&r.locality_id!=ex.locality_id)df.push('localidad');if(r.role!=ex.role)df.push(`rol ${ex.role||'–'} → ${r.role}`);if(r.partner&&r.partner!=ex.partner)df.push('compañero');if(r.category_id&&r.category_id!=ex.category_id)df.push('categoría');return{k:df.length?'chg':'same',ex,diffs:df}}

for(let p=1;p<=doc.numPages;p++){const tc=await(await doc.getPage(p)).getTextContent(),rows={};tc.items.forEach(it=>{const y=Math.round(it.transform[5]/3);(rows[y]=rows[y]||[]).push({x:it.transform[4],t:it.str,w:it.width})});
